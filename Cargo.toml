[package]
name = "pixel_uno"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy = { version = "0.19.1", features = [ "wayland", "webp" ] }
bevy_asset_loader = { version = "0.27.0", features = [ "2d" ] }
bevy-inspector-egui = { version = "0.37.0", optional = true }
num_enum = { version = "0.7.6" }
rand = { version = "0.10.3" }
anyhow = { version = "1.0.104" }

# Fix Lock Versions
bytes = "1.12.1"

[features]
debug = ["dep:bevy-inspector-egui"]
